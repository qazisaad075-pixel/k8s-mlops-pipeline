apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-ml-deployment
  namespace: mlops-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: iris-ml
  template:
    metadata:
      labels:
        app: iris-ml
    spec:
      containers:
      - name: ml-api
        image: iris-ml-api:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: iris-nginx-lb
  namespace: mlops-prod
spec:
  type: LoadBalancer
  selector:
    app: iris-ml
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30085
